name: Build Kernel

on:
  # Temporary CI trigger used while validating this workflow branch.
  push:
    branches:
      - chatgpt/resukisu-build
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Kernel defconfig name'
        required: true
        default: 'a3core_eur_open_defconfig'
      rootSolution:
        description: 'Kernel root implementation'
        required: true
        type: choice
        options:
          - KernelSU-Next
          - ReSukiSU
        default: ReSukiSU
      disableCm4Watchdog:
        description: 'Disable PM_SYS/CM4 watchdog for reboot debugging'
        required: true
        type: boolean
        default: false
      isPermissive:
        description: 'Force permissive SELinux kernel'
        required: true
        type: boolean
        default: false
      isFlashableZip:
        description: 'Generate AnyKernel3 flashable artifact'
        required: true
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ARCH: arm64
      KERNEL_ROOT: ${{ github.workspace }}
      CROSS_COMPILE: "${{ github.workspace }}/toolchains/gcc-14.3/bin/aarch64-none-linux-gnu-"
      CROSS_COMPILE_ARM32: "${{ github.workspace }}/toolchains/gcc-14.3/bin/arm-none-linux-gnueabihf-"
      CC: clang

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Resolve build options
        shell: bash
        run: |
          ROOT_SOLUTION="${{ inputs.rootSolution }}"
          DEFCONFIG="${{ inputs.defconfig }}"

          # push is only used for CI validation of this branch.
          if [ -z "$ROOT_SOLUTION" ]; then
            ROOT_SOLUTION="ReSukiSU"
          fi
          if [ -z "$DEFCONFIG" ]; then
            DEFCONFIG="a3core_eur_open_defconfig"
          fi

          echo "ROOT_SOLUTION=$ROOT_SOLUTION" >> "$GITHUB_ENV"
          echo "DEFCONFIG=$DEFCONFIG" >> "$GITHUB_ENV"
          echo "Root solution: $ROOT_SOLUTION"
          echo "Defconfig: $DEFCONFIG"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make gcc g++ python3 bc libncurses-dev flex bison ccache \
            libssl-dev libelf-dev libyaml-dev wget tar xz-utils zip unzip

      - name: Setup GCC 14.3 & Clang
        run: |
          mkdir -p toolchains/gcc-14.3 toolchains/clang-r383902b

          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/0e9e7035bf8ad42437c6156e5950eab13655b26c/clang-r383902b.tar.gz -O clang.tar.gz
          tar -xf clang.tar.gz -C toolchains/clang-r383902b
          rm clang.tar.gz

          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz
          tar -xf gcc.tar.xz -C toolchains/gcc-14.3 --strip-components=1
          rm gcc.tar.xz

          echo "${{ github.workspace }}/toolchains/clang-r383902b/bin" >> "$GITHUB_PATH"
          echo "${{ github.workspace }}/toolchains/gcc-14.3/bin" >> "$GITHUB_PATH"

      - name: Integrate selected KernelSU implementation
        shell: bash
        run: |
          set -euxo pipefail

          # The source tree already contains an embedded KernelSU snapshot.
          # Replace only the KernelSU source/symlink for this build, while
          # preserving the device-specific manual hooks already in the kernel.
          rm -rf KernelSU KernelSU-Next
          rm -f drivers/kernelsu

          case "$ROOT_SOLUTION" in
            KernelSU-Next)
              # 4.14 is a legacy/non-GKI kernel, so use KernelSU-Next legacy.
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/legacy/kernel/setup.sh" | bash -s legacy
              ;;
            ReSukiSU)
              curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
              ;;
            *)
              echo "Unsupported root solution: $ROOT_SOLUTION" >&2
              exit 2
              ;;
          esac

          readlink -f drivers/kernelsu
          test -f drivers/kernelsu/Kconfig

      - name: Disable CM4 watchdog for diagnostic build
        if: ${{ github.event_name == 'push' || inputs.disableCm4Watchdog == true }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('drivers/watchdog/sprd_pmic_wdt.c')
          text = path.read_text()
          old = 'pmic_wdt->wdten = sprd_pimc_wdt_en();'
          new = 'pmic_wdt->wdten = false; /* diagnostic: disable PM_SYS/CM4 watchdog */'
          if old not in text:
              raise SystemExit(f'Expected watchdog assignment not found in {path}')
          path.write_text(text.replace(old, new, 1))
          PY
          grep -n "pmic_wdt->wdten" drivers/watchdog/sprd_pmic_wdt.c

      - name: Configure kernel
        shell: bash
        run: |
          set -euxo pipefail
          make -C "$KERNEL_ROOT" O="$KERNEL_ROOT/out" ARCH="$ARCH" "$DEFCONFIG"

          chmod +x scripts/config
          scripts/config --file out/.config -e KSU

          # Linux 4.14 must use manual hooks for both supported implementations.
          scripts/config --file out/.config -e KSU_MANUAL_HOOK

          if [ "$ROOT_SOLUTION" = "ReSukiSU" ]; then
            scripts/config --file out/.config -d KSU_TRACEPOINT_HOOK || true
            scripts/config --file out/.config -d KSU_SUSFS || true
          else
            scripts/config --file out/.config -d KSU_KPROBES_HOOK || true
          fi

          make -C "$KERNEL_ROOT" O="$KERNEL_ROOT/out" ARCH="$ARCH" olddefconfig
          grep -E '^CONFIG_KSU|^# CONFIG_KSU' out/.config || true

      - name: Patch permissive
        if: ${{ inputs.isPermissive == true }}
        run: |
          TARGET_BRANCH="KernelSU-permissive"
          git fetch --depth 1 origin "$TARGET_BRANCH"
          git checkout FETCH_HEAD -- security/selinux/hooks.c
          git checkout FETCH_HEAD -- security/selinux/selinuxfs.c
          echo "Permissive patch applied from $TARGET_BRANCH"

      - name: Build kernel
        shell: bash
        run: |
          set -euxo pipefail

          export KBUILD_BUILD_HOST="$(. /etc/os-release && echo ${NAME}-${VERSION_ID})"
          export KBUILD_BUILD_TIMESTAMP="$(date '+%a %b %d %T WIB %Y')"

          # Ignore YAML dtc helpers unavailable in this old vendor tree.
          sed -i '/yamltree.o/d' scripts/dtc/Makefile
          sed -i '/dt_to_yaml/d' scripts/dtc/dtc.c

          make -C "$KERNEL_ROOT" O="$KERNEL_ROOT/out" -j"$(nproc)" \
            ARCH="$ARCH" CC="$CC" CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" Image

          test -s "$KERNEL_ROOT/out/arch/arm64/boot/Image"
          ls -lh "$KERNEL_ROOT/out/arch/arm64/boot/Image"

      - name: Build AnyKernel3 Flashable Zip
        if: ${{ github.event_name == 'push' || inputs.isFlashableZip == true }}
        shell: bash
        run: |
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git AK3
          cp "$KERNEL_ROOT/out/arch/arm64/boot/Image" AK3/

          cd AK3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i "s/kernel.string=.*/kernel.string=A032F-erofs-${ROOT_SOLUTION} by VildanG/g" anykernel.sh
          sed -i 's|BLOCK=.*|BLOCK=auto;|g' anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=0;/g' anykernel.sh
          sed -i '/# init.rc/,/append_file fstab.tuna.*/d' anykernel.sh

          zip -r9 "../A032F-erofs-${ROOT_SOLUTION}.zip" . -x '.git/*' '.github/*'
          cd ..
          ls -lh "A032F-erofs-${ROOT_SOLUTION}.zip"

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image-${{ env.ROOT_SOLUTION }}
          path: |
            ${{ github.workspace }}/out/arch/arm64/boot/Image
            ${{ github.workspace }}/out/.config
          retention-days: 7

      - name: Upload AnyKernel3 Zip
        if: ${{ github.event_name == 'push' || inputs.isFlashableZip == true }}
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-${{ env.ROOT_SOLUTION }}
          path: ${{ github.workspace }}/A032F-erofs-${{ env.ROOT_SOLUTION }}.zip
          retention-days: 7
